name: walking-app
services:
  db:
    image: postgres:18
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-walking_app}
      POSTGRES_USER: ${POSTGRES_USER:-walking_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-walking_app_dev}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8081,http://127.0.0.1:8081}
      WATCHFILES_FORCE_POLLING: "true"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend/app:/app/app
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 10
      start_period: 10s

  frontend:
    build: ./frontend
    ports:
      - "8081:8081"
    environment:
      EXPO_PUBLIC_API_URL: ${EXPO_PUBLIC_API_URL:-http://localhost:8000}
      EXPO_NO_TELEMETRY: "1"
      BROWSER: none
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    # ロックファイルの変更を反映し、コンテナ専用の依存パッケージを同期します。
    command: sh -c "npm ci --no-audit --no-fund && npm run web -- --host lan --port 8081"
    depends_on:
      backend:
        condition: service_healthy
    stdin_open: true
    tty: true

volumes:
  frontend_node_modules:
  postgres_data:
